name: Build and Publish Django Docker Image (Production)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" \
          --health-interval=10s \
          --health-timeout=5s \
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r smrcwebpage/requirements.txt

    - name: Run Django tests
      env:
        DJANGO_SETTINGS_MODULE: smrcwebpage.settings
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      run: |
        cd smrcwebpage
        python manage.py migrate
        python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t serjanxiety/srmc-website:latest ./smrcwebpage

      - name: Push Docker image to DockerHub
        run: |
          docker push serjanxiety/srmc-website:latest
